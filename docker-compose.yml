name: kaijun

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change_me_root}
      MYSQL_DATABASE: ${DB_DATABASE:-kaijun}
      MYSQL_USER: ${DB_USERNAME:-kaijun}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change_me}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # CMD-SHELL 才能展开容器内 MYSQL_ROOT_PASSWORD（exec 形式不会展开）
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  app:
    build:
      context: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/var/www/html
    working_dir: /var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-kaijun}
      DB_USERNAME: ${DB_USERNAME:-kaijun}
      DB_PASSWORD: ${DB_PASSWORD:-change_me}
      SESSION_DRIVER: database
      SESSION_DOMAIN: null
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change_me}
      OCTANE_SERVER: swoole
    depends_on:
      db:
        condition: service_healthy
    command: php artisan octane:start --server=swoole --host=0.0.0.0 --port=8000

  web:
    image: node:22
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
    working_dir: /app
    environment:
      VITE_API_TARGET: http://app:8000
    depends_on:
      - app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"

volumes:
  mysql-data:
